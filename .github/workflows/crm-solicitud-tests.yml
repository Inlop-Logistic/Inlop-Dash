name: CRM solicitud contract tests

on:
  push:
    branches:
      - test/integracion-crm-solicitudes
  pull_request:
    branches:
      - test/integracion-crm-solicitudes

jobs:
  crm-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run CRM contract and persistence tests
        run: node --test tests/crmSolicitudContractValidator.test.js tests/crmSolicitudesRouter.test.js tests/crmSolicitudesPersistence.test.js
